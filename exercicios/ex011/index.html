<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Tente abrir essa imagem em vários dispositivos diferentes ou simplesmente aumente oe diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="Imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="Imagens/foto-m.png" type="image/png">
        <img src="Imagens/foto-g.png" alt="Imagem flexível">
    </picture>
    <h1>Reprosuzindo audio</h1>
    <p>Vamos aprender a reproduzir audios em html5.</p>
    <audio src="midia/audio01.mp3" controls autoplay></audio>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/audio01.mp3" type="audio/mpeg">
        <source src="midia/audio01.ogg" type="audio/ogg">
        <source src="midia/audio01.wav" type="audio/wav">
    </audio>
</body>
</html>
